<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Календарь инкассаций</title><script src="https://unpkg.com/lucide@latest"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font:14px Arial,sans-serif}header{height:64px;border-bottom:1px solid #dadce0;display:flex;align-items:center;padding:0 24px;gap:16px}header h1{font-size:22px;font-weight:400;margin:0}.logo{color:#6f42c1;display:flex}.nav{border:1px solid #dadce0;background:#fff;border-radius:4px;padding:8px 12px;font-weight:600;cursor:pointer}.month{font-size:20px;margin-left:8px}.spacer{flex:1}.link{color:#3c4043;text-decoration:none;font-weight:600}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid #dadce0;padding:18px 16px}.create{display:flex;align-items:center;gap:11px;border:0;border-radius:24px;background:#fff;box-shadow:0 1px 5px #0004;padding:13px 18px;font-size:14px;color:#3c4043;font-weight:600;cursor:pointer}.create i{color:#6f42c1}.mini-title{margin:27px 0 12px;font-size:12px;font-weight:bold;color:#5f6368;text-transform:uppercase}.legend{display:flex;align-items:center;gap:9px;margin:13px 4px;color:#5f6368}.dot{height:10px;width:10px;border-radius:50%}.note{font-size:12px;line-height:1.55;color:#5f6368;background:#f8f9fa;padding:12px;border-radius:8px;margin-top:25px}.main{overflow:auto}.toolbar{height:64px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #dadce0;gap:10px}.toolbar button{border:1px solid #dadce0;background:#fff;border-radius:4px;padding:8px 11px;cursor:pointer}.toolbar button.active{color:#fff;background:#6f42c1;border-color:#6f42c1}.status{margin-left:auto;color:#5f6368;font-size:12px}.calendar{min-width:900px;display:grid;grid-template-columns:repeat(7,1fr)}.dow{height:46px;border-bottom:1px solid #dadce0;text-align:center;padding-top:12px;font-size:11px;font-weight:bold;color:#70757a;text-transform:uppercase}.day{height:calc((100vh - 174px)/5);min-height:125px;border-right:1px solid #e8eaed;border-bottom:1px solid #e8eaed;padding:7px;overflow:hidden}.day:nth-child(7n){border-right:0}.date{font-size:12px;color:#5f6368;width:25px;height:25px;line-height:25px;text-align:center;border-radius:50%;margin-bottom:4px}.today .date{background:#6f42c1;color:#fff}.outside{background:#fafafa}.outside .date{color:#adb1b7}.event{border-radius:4px;padding:4px 6px;margin:3px 0;font-size:11px;line-height:1.28;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.critical{background:#fce8e6;color:#a50e0e;border-left:3px solid #d93025}.event.high{background:#fef7e0;color:#8d5f00;border-left:3px solid #f9ab00}.event.planned{background:#e8f0fe;color:#174ea6;border-left:3px solid #4285f4}.more{font-size:11px;font-weight:bold;color:#5f6368;padding:3px;cursor:pointer}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10}.modal.open{display:flex}.dialog{width:min(540px,calc(100vw - 28px));background:#fff;border-radius:10px;box-shadow:0 12px 30px #0005;overflow:hidden}.dialog-head{padding:17px 20px;background:#6f42c1;color:#fff;font-size:17px}.dialog-body{padding:20px;line-height:1.7}.kv{display:grid;grid-template-columns:155px 1fr;border-bottom:1px solid #eee;padding:8px 0}.kv b{color:#5f6368}.close{float:right;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{display:none}header{padding:0 12px}.month{font-size:16px}.calendar{min-width:760px}}</style></head><body><header><span class="logo"><i data-lucide="calendar-days"></i></span><h1>Инкассации</h1><button class="nav" onclick="changeMonth(-1)">‹</button><button class="nav" onclick="changeMonth(1)">›</button><button class="nav" onclick="today()">Сегодня</button><span class="month" id="month"></span><span class="spacer"></span><a class="link" href="/dashboard/map.html">Карта</a><a class="link" href="/dashboard/index.html">Главная</a></header><div class="layout"><aside><button class="create" onclick="loadPlan()"><i data-lucide="sparkles"></i> Обновить прогноз</button><div class="mini-title">Маршруты</div><div class="legend"><span class="dot" style="background:#d93025"></span> Срочная инкассация</div><div class="legend"><span class="dot" style="background:#f9ab00"></span> В течение 24 часов</div><div class="legend"><span class="dot" style="background:#4285f4"></span> Плановый выезд</div><div class="note"><b>Умный план</b><br>Каждое событие — ATM, прогнозируемый к low-cash. Маршрут начинается у фиолетового филиала с признаком «Инкассация = 1» и остаётся в своём регионе.</div></aside><section class="main"><div class="toolbar"><button class="active" onclick="setHorizon(2,this)">2 дня</button><button onclick="setHorizon(7,this)">7 дней</button><button onclick="setHorizon(14,this)">14 дней</button><span class="status" id="status">Загрузка прогноза…</span></div><div class="calendar" id="dow"></div><div class="calendar" id="grid"></div></section></div><div class="modal" id="modal"><div class="dialog"><div class="dialog-head">Карточка плановой инкассации <button class="close" onclick="modal.classList.remove('open')">×</button></div><div class="dialog-body" id="dialog"></div></div></div><script>lucide.createIcons();const base=`${location.protocol}//${location.hostname}:8000`;let cursor=new Date(),events=[],horizon=2;const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];dow.innerHTML=names.map(x=>`<div class="dow">${x}</div>`).join('');function ruMonth(d){return d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}function key(d){return d.toISOString().slice(0,10)}function render(){month.textContent=ruMonth(cursor).replace(/^./,x=>x.toUpperCase());let first=new Date(cursor.getFullYear(),cursor.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-offset);let html='';for(let i=0;i<35;i++){let d=new Date(start);d.setDate(start.getDate()+i);let dayEvents=events.filter(e=>key(new Date(e.due_at))===key(d));let isToday=key(d)===key(new Date());html+=`<div class="day ${d.getMonth()!==cursor.getMonth()?'outside':''} ${isToday?'today':''}"><div class="date">${d.getDate()}</div>${dayEvents.slice(0,3).map((e,n)=>`<div class="event ${e.priority}" onclick="details(${events.indexOf(e)})">${new Date(e.due_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} · ${e.region||'Регион'} · ${e.address||e.terminal_id}</div>`).join('')}${dayEvents.length>3?`<div class="more">+ ещё ${dayEvents.length-3}</div>`:''}</div>`}grid.innerHTML=html}function changeMonth(n){cursor.setMonth(cursor.getMonth()+n);render()}function today(){cursor=new Date();render()}function setHorizon(n,b){horizon=n;document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadPlan()}async function loadPlan(){status.textContent='Строим прогноз и маршруты…';try{let d=await fetch(base+'/api/incassation/plan?days='+horizon).then(r=>r.json());events=d.planned_atms||[];status.textContent=events.length?`Запланировано ATM: ${events.length} · горизонт ${horizon} дн.`:'Нет ATM с балансами для прогноза';render()}catch(e){status.textContent='Ошибка загрузки: '+e.message}}function details(i){let e=events[i];dialog.innerHTML=`<div class="kv"><b>ATM</b><span>${e.address||e.terminal_id}</span></div><div class="kv"><b>Регион</b><span>${e.region||'Не указан'}</span></div><div class="kv"><b>Плановый выезд</b><span>${new Date(e.due_at).toLocaleString('ru-RU')}</span></div><div class="kv"><b>До low-cash</b><span>${e.hours_to_low_cash} часов</span></div><div class="kv"><b>Приоритет</b><span>${e.priority}</span></div><div class="kv"><b>Рекомендовать загрузку</b><span>${Math.round(e.recommended_refill/1000000)} млн сум</span></div><p style="margin-top:15px;color:#5f6368">Маршрут будет построен от филиала-инкассатора этого региона.</p>`;modal.classList.add('open')}loadPlan()</script></body></html>
